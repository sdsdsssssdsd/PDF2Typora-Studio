name: Bug report
description: Something in the app crashed, hung, or behaved incorrectly (not a single-PDF conversion case).
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for UI crashes, config errors, install problems, or general defects.
        For a specific PDF that fails mid-pipeline, prefer **PDF conversion failure**.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234 or tag
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11 · Python 3.12 · …
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Screenshots, related issues, workarounds.
