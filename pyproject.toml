[project]
name = "pdf2typora-studio"
version = "0.1.0"
description = "PDF to Typora Markdown conversion studio with local Vision AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "PyMuPDF>=1.24.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psutil>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
